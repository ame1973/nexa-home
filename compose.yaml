# Pull-only deployment; no source checkout, Dockerfile, Node or Go is required.
# Copy .env.example to .env for the explicitly isolated loopback HTTP preset.
name: nexa-home

services:
  nexa-home:
    image: "${NEXA_IMAGE:-ghcr.io/ame1973/nexa-home:latest}"
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${NEXA_HOST_BIND:-127.0.0.1}:${NEXA_HOST_PORT:-8080}:8080"
    environment:
      NEXA_LISTEN: "0.0.0.0:8080"
      NEXA_DATA_DIR: /data
      NEXA_PUBLIC_ORIGIN: "${NEXA_PUBLIC_ORIGIN:-}"
      NEXA_TRUSTED_PROXY_CIDRS: "${NEXA_TRUSTED_PROXY_CIDRS:-}"
      NEXA_ALLOW_HTTP_COOKIE: "${NEXA_ALLOW_HTTP_COOKIE:-false}"
      NEXA_LOG_LEVEL: "${NEXA_LOG_LEVEL:-info}"
      TZ: UTC
    volumes:
      - nexa_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,size=16m,noexec,nosuid,nodev,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/nexa-home", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nexa_data:
