name: Verify

on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: Validated plan version whose tested artifacts should be exported
        type: string
        required: false
        default: ""
      release_plan_digest:
        description: Exact identity of this run's source-bound release plan
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      NEXA_TEST_PLATFORM: linux/${{ matrix.arch }}
      NEXA_TEST_IMAGE: nexa-home:ci-${{ matrix.arch }}
      NEXA_BUILD_VERSION: ${{ inputs.release_version }}
      NEXA_RELEASE_PLAN_DIGEST: ${{ inputs.release_plan_digest }}
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download this run's source-bound release plan
        if: ${{ inputs.release_version != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: release-plan
          skip-decompress: false
      - name: Validate and stamp the build version in this checkout only
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            if [ -z "$NEXA_RELEASE_PLAN_DIGEST" ]; then
              printf '%s\n' 'A versioned build requires the exact release plan.' >&2
              exit 1
            fi
            node scripts/release.mjs metadata
            node scripts/release.mjs stamp
          fi
          version=$(node scripts/release.mjs version)
          if [ -n "$RELEASE_VERSION" ] && [ "$RELEASE_VERSION" != "$version" ]; then
            printf '%s\n' 'The requested release and stamped versions must match.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check contracts and generated artifacts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/ci.yaml .github/workflows/release.yaml .github/workflows/pull-request.yaml
          npm run check:generated
          npm run lint:api
          npm run test:contract
          npm run test:docs
          npm run test:security-policy
      - name: Check frontend and build compatibility
        run: |
          npm run typecheck
          npm run lint:web
          npm run test:build
          npm run test:release
          npm run test:web
          npm run build
          npm run notices -- --check
      - name: Check Go formatting, races and vet
        run: |
          test -z "$(gofmt -l api cmd db internal)"
          go test -race -cover -count=1 ./...
          go vet ./...
      - name: Fuzz input boundaries
        run: |
          GOMAXPROCS=2 go test ./internal/assets -run '^$' -fuzz FuzzImageValidation -fuzztime=10s -parallel=2
          GOMAXPROCS=2 go test ./api -run '^$' -fuzz FuzzStrictJSON -fuzztime=10s -parallel=2
      - name: Scan source and executable
        run: |
          npm audit --include=dev
          runtime_deps=$(go list -deps ./cmd/nexa-home)
          if printf '%s\n' "$runtime_deps" | grep -Ei '(^|/)openpgp(/|$)' >/dev/null; then
            printf '%s\n' 'OpenPGP must not enter runtime dependencies.' >&2
            exit 1
          fi
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary -show verbose bin/nexa-home
      - name: Install matching Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Test the built application in Chromium
        run: npm exec -- playwright test
      - name: Set up the supported Docker toolchain
        id: docker
        uses: ./.github/actions/docker-toolchain
      - name: Build the native OCI image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: deploy/Dockerfile
          builder: ${{ steps.docker.outputs.builder }}
          platforms: ${{ env.NEXA_TEST_PLATFORM }}
          tags: ${{ env.NEXA_TEST_IMAGE }}
          load: true
          outputs: type=docker,oci-mediatypes=true
          push: false
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ steps.version.outputs.revision }}
            SOURCE=https://github.com/${{ github.repository }}
      - name: Test real Compose deployment
        run: npm run test:container
      - name: Scan the runtime image without a daemon socket
        run: npm run scan:image
      - name: Export the tested release executable and image
        if: ${{ inputs.release_version != '' }}
        run: |
          node scripts/release.mjs package
          arch=${NEXA_TEST_PLATFORM#linux/}
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 \
            -mode=binary -show verbose "release-artifacts/$arch/nexa-home"
      - name: Retain only verified release artifacts
        if: ${{ inputs.release_version != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: release-artifacts/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 0
          include-hidden-files: false
          archive: true
