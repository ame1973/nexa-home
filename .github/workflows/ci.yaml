name: Verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: Validated tag version whose tested artifacts should be exported
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      NEXA_TEST_PLATFORM: linux/${{ matrix.arch }}
      NEXA_TEST_IMAGE: nexa-home:ci-${{ matrix.arch }}
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate build version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          version=$(node scripts/release.mjs version)
          if [ -n "$RELEASE_VERSION" ] && [ "$RELEASE_VERSION" != "$version" ]; then
            printf '%s\n' 'The requested release and source versions must match.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check contracts and generated artifacts
        run: |
          npm run check:generated
          npm run lint:api
          npm run test:contract
          npm run test:docs
          npm run test:security-policy
      - name: Check frontend and build compatibility
        run: |
          npm run typecheck
          npm run lint:web
          npm run test:build
          npm run test:release
          npm run test:web
          npm run build
          npm run notices -- --check
      - name: Check Go formatting, races and vet
        run: |
          test -z "$(gofmt -l api cmd db internal)"
          go test -race -cover ./...
          go vet ./...
      - name: Fuzz input boundaries
        run: |
          GOMAXPROCS=2 go test ./internal/assets -run '^$' -fuzz FuzzImageValidation -fuzztime=10s -parallel=2
          GOMAXPROCS=2 go test ./api -run '^$' -fuzz FuzzStrictJSON -fuzztime=10s -parallel=2
      - name: Scan source and executable
        run: |
          npm audit --include=dev
          runtime_deps=$(go list -deps ./cmd/nexa-home)
          if printf '%s\n' "$runtime_deps" | grep -Ei '(^|/)openpgp(/|$)' >/dev/null; then
            printf '%s\n' 'OpenPGP must not enter runtime dependencies.' >&2
            exit 1
          fi
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary -show verbose bin/nexa-home
      - name: Install matching Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Test the built application in Chromium
        run: npm exec -- playwright test
      - name: Build the native OCI image without publishing
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          BUILD_REVISION: ${{ steps.version.outputs.revision }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          docker buildx build --platform "$NEXA_TEST_PLATFORM" --load \
            --build-arg "VERSION=$BUILD_VERSION" \
            --build-arg "REVISION=$BUILD_REVISION" --build-arg "SOURCE=$SOURCE_URL" \
            --tag "$NEXA_TEST_IMAGE" --file deploy/Dockerfile .
      - name: Test real Compose deployment
        run: npm run test:container
      - name: Scan the runtime image without a daemon socket
        run: npm run scan:image
      - name: Export the tested release executable and image
        if: ${{ inputs.release_version != '' && github.ref_type == 'tag' }}
        run: |
          node scripts/release.mjs package
          arch=${NEXA_TEST_PLATFORM#linux/}
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 \
            -mode=binary -show verbose "release-artifacts/$arch/nexa-home"
      - name: Retain only verified release artifacts
        if: ${{ inputs.release_version != '' && github.ref_type == 'tag' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: release-artifacts/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
          archive: true
