        required: true
        schema:
          type: string
      operationId: postApiV1AdminBackupValidate
  /api/v1/admin/backup/commit:
    post:
      tags:
      - backup
      summary: Commit last validated payload stored server-side for 5min; atomically replace application configuration, no
        credentials
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - revision
                properties:
                  revision:
                    type: integer
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - importToken
              - replace
              properties:
                importToken:
                  type: string
                replace:
                  type: boolean
                  const: true
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      operationId: postApiV1AdminBackupCommit
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: nexa_session
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
          additionalProperties: false
      additionalProperties: false
    Category:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - icon
      - position
      - isVisible
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        position:
          type: integer
          minimum: 0
          maximum: 2147483647
        isVisible:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CategoryInput:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - icon
      - isVisible
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
          maxLength: 240
        icon:
          type: string
          maxLength: 80
        isVisible:
          type: boolean
    HealthStatus:
      type: object
      description: Latest result only; unknown before the first check or when the result is stale.
      additionalProperties: false
      required: [serviceId, status, checkedAt]
      properties:
        serviceId:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          enum: [unknown, up, down]
        checkedAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
    HealthCheck:
      type: object
      description: Explicit administrator-configured HTTP(S) health endpoint. Never exposed in public homepage data.
      additionalProperties: false
      required: [url, intervalSeconds]
      properties:
        url:
          type: string
          minLength: 8
          maxLength: 2048
          description: Absolute HTTP(S) URL without credentials, controls or a fragment.
        intervalSeconds:
          type: integer
          minimum: 30
          maximum: 86400
    ServiceLinkInput:
      type: object
      additionalProperties: false
      required:
      - label
      - url
      properties:
        label:
          type: string
          enum:
          - primary
          - lan
          - wan
        url:
          type: string
          minLength: 8
          maxLength: 2048
          description: Absolute http(s), no userinfo
    ServiceInput:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - categoryId
      - iconKind
      - iconValue
      - iconAssetId
      - color
      - openMode
      - isFavorite
      - isVisible
      - tagIds
      - links
      properties:
        name: &id009
          type: string
          minLength: 1
          maxLength: 80
        description: &id010
          type: string
          maxLength: 240
        categoryId: &id011
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: 'null'
        iconKind: &id012
          type: string
          enum:
          - lucide
          - asset
          - favicon
        iconValue: &id013
          type: string
          minLength: 1
          maxLength: 120
        iconAssetId: &id014
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: 'null'
        color: &id015
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        openMode: &id016
          type: string
          enum:
          - new_tab
          - same_tab
        isFavorite: &id017
          type: boolean
        isVisible: &id018
          type: boolean
        tagIds: &id019
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UUID'
        healthCheck:
          description: Omit to preserve an existing check; null disables it.
          oneOf:
          - $ref: '#/components/schemas/HealthCheck'
          - type: 'null'
        links:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/ServiceLinkInput'
          description: Exactly one primary, optional lan/wan, no duplicate labels
    ServiceLink:
      type: object
      required:
      - id
      - label
      - url
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        label:
          type: string
          enum:
          - primary
          - lan
          - wan
        url:
          type: string
      additionalProperties: false
    Service:
      type: object
      required:
      - name
      - description
      - categoryId
      - iconKind
      - iconValue
      - iconAssetId
      - color
      - openMode
      - isFavorite
      - isVisible
      - tagIds
      - links
      - id
      - position
      - createdAt
      - updatedAt
      properties:
        name: *id009
        description: *id010
        categoryId: *id011
        iconKind: *id012
        iconValue: *id013
        iconAssetId: *id014
        color: *id015
        openMode: *id016
        isFavorite: *id017
        isVisible: *id018
        tagIds: *id019
        healthCheck:
          oneOf:
          - $ref: '#/components/schemas/HealthCheck'
          - type: 'null'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ServiceLink'
        id:
          $ref: '#/components/schemas/UUID'
        position:
          type: integer
          minimum: 0
          maximum: 2147483647
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    Tag:
      type: object
      required:
      - id
      - name
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    Settings:
      type: object
      required:
      - siteTitle
      - siteSubtitle
      - accessMode
      - theme
      - accent
      - cardDensity
      - glassEnabled
      - revision
      - updatedAt
      properties:
        siteTitle:
          type: string
        siteSubtitle:
          type: string
        accessMode:
          type: string
          enum:
          - public
          - private
        theme:
          type: string
          enum:
          - dark
          - light
          - system
        accent:
          type: string
        cardDensity:
          type: string
          enum:
          - compact
          - comfortable
        glassEnabled:
          type: boolean
        themePreset:
          $ref: '#/components/schemas/ThemePreset'
        customTheme:
          oneOf:
          - $ref: '#/components/schemas/CustomTheme'
          - type: 'null'
        customCSS:
          type: string
          maxLength: 65536
          description: Public advanced stylesheet, at most 65536 UTF-8 bytes without NUL. Arbitrary CSS selectors and rules are accepted; CSP still blocks external resources and JavaScript.
        revision:
          type: integer
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    SettingsUpdate:
      type: object
      additionalProperties: false
      dependentRequired:
        themePreset: [customTheme, customCSS]
        customTheme: [themePreset, customCSS]
        customCSS: [themePreset, customTheme]
      description: Omit all three appearance extensions for a legacy update that preserves them. New clients send all three together; theme still selects dark, light or system independently of the style preset.
      required:
      - expectedRevision
      - siteTitle
      - siteSubtitle
      - accessMode
      - theme
      - accent
      - cardDensity
      - glassEnabled
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        siteTitle:
          type: string
          minLength: 1
          maxLength: 80
        siteSubtitle:
          type: string
          maxLength: 160
        accessMode:
          type: string
          enum:
          - public
          - private
        theme:
          type: string
          enum:
          - dark
          - light
          - system
        accent:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        cardDensity:
          type: string
          enum:
          - compact
          - comfortable
        glassEnabled:
          type: boolean
        themePreset:
          $ref: '#/components/schemas/ThemePreset'
        customTheme:
          oneOf:
          - $ref: '#/components/schemas/CustomTheme'
          - type: 'null'
        customCSS:
          type: string
          maxLength: 65536
          description: Public advanced stylesheet, at most 65536 UTF-8 bytes without NUL. Arbitrary CSS selectors and rules are accepted; CSP still blocks external resources and JavaScript.
    ThemePreset:
      type: string
      enum: [future-glass, graphite, tide, forest, dune, custom]
    ThemePalette:
      type: object
      additionalProperties: false
      required: [background, surface, accent]
      properties:
        background:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        surface:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        accent:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
    CustomTheme:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, variants, radius, shadow]
      description: A token-only theme, at most 16384 canonical JSON bytes. Background and surface must share black or white text at 4.5:1 or better; remaining semantic tokens are derived. Raw CSS is a separate field/file.
      properties:
        schemaVersion:
          type: integer
          const: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
        variants:
          type: object
          additionalProperties: false
          required: [light, dark]
          properties:
            light:
              $ref: '#/components/schemas/ThemePalette'
            dark:
              $ref: '#/components/schemas/ThemePalette'
        radius:
          type: integer
          enum: [8, 12, 16, 20]
        shadow:
          type: string
          enum: [none, soft]
    Asset:
      type: object
      required:
      - id
      - mimeType
      - byteSize
      - url
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        mimeType:
          type: string
          enum:
          - image/png
          - image/webp
          - image/svg+xml
        byteSize:
          type: integer
        url:
          type: string
      additionalProperties: false
    UUID:
      type: string
      format: uuid
    ReorderInput:
      type: object
      additionalProperties: false
      required:
      - ids
      properties:
        ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UUID'
    Backup:
      type: object
      description: Exports use version 3 and include explicit health checks, shared preset, custom tokens and advanced CSS. Versions 1 and 2 import without health checks; version 1 defaults to Future Glass without custom CSS. Browser-only preferences and status history are never exported.
      allOf:
      - if:
          properties:
            version:
              enum: [2, 3]
        then:
          properties:
            settings:
              $ref: '#/components/schemas/Settings'
              required: [themePreset, customTheme, customCSS]
      required:
      - format
      - version
      - exportedAt
      - settings
      - categories
      - services
      - tags
      - assets
      properties:
        format:
          type: string
          const: nexa-home-backup
        version:
          type: integer
          enum: [1, 2, 3]
        exportedAt:
          type: string
          format: date-time
        settings:
          $ref: '#/components/schemas/Settings'
        categories:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Category'
        services:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Service'
        tags:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Tag'
        assets:
          type: array
          maxItems: 1024
          items:
            type: object
            required:
            - id
            - mimeType
            - base64
            properties:
              id:
                $ref: '#/components/schemas/UUID'
              mimeType:
                type: string
                enum:
                - image/png
                - image/webp
                - image/svg+xml
              base64:
                type: string
                maxLength: 1398104
                contentEncoding: base64
            additionalProperties: false
      additionalProperties: false
