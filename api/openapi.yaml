      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      operationId: getApiV1AdminCategories
    post:
      tags:
      - categories
      summary: Create category
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      operationId: postApiV1AdminCategories
  /api/v1/admin/categories/{id}:
    put:
      tags:
      - categories
      summary: Replace category fields
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - &id007
        in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      operationId: putApiV1AdminCategoriesById
    delete:
      tags:
      - categories
      summary: Delete category and uncategorize services
      responses:
        '204':
          description: OK
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - *id007
      operationId: deleteApiV1AdminCategoriesById
  /api/v1/admin/categories/reorder:
    put:
      tags:
      - categories
      summary: Reorder entire category id list
      responses:
        '204':
          description: OK
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderInput'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      operationId: putApiV1AdminCategoriesReorder
  /api/v1/admin/services:
    get:
      tags:
      - services
      summary: List services, optional search, pagination; deterministic position order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - total
                - page
                - pageSize
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
      operationId: getApiV1AdminServices
    post:
      tags:
      - services
      summary: Create service, links and tags atomically
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      operationId: postApiV1AdminServices
  /api/v1/admin/services/{id}:
    get:
      tags:
      - services
      summary: Get one service
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      parameters:
      - *id007
      operationId: getApiV1AdminServicesById
    put:
      tags:
      - services
      summary: Replace service, links, tag associations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - *id007
      operationId: putApiV1AdminServicesById
    delete:
      tags:
      - services
      summary: Delete service
      responses:
        '204':
          description: OK
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - *id007
      operationId: deleteApiV1AdminServicesById
  /api/v1/admin/services/reorder:
    put:
      tags:
      - services
      summary: Reorder exactly one category including hidden services
      responses:
        '204':
          description: OK
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - categoryId
              - ids
              properties:
                categoryId:
                  oneOf:
                  - $ref: '#/components/schemas/UUID'
                  - type: 'null'
                ids:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/UUID'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      operationId: putApiV1AdminServicesReorder
  /api/v1/admin/tags:
    get:
      tags:
      - tags
      summary: List tags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      operationId: getApiV1AdminTags
    post:
      tags:
      - tags
      summary: Create tag
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: &id008
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 32
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      operationId: postApiV1AdminTags
