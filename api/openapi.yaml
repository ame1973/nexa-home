openapi: 3.1.0
info:
  title: Nexa Home API
  version: 1.0.0
  description: Nexa Home P0 HTTP contract. Authenticated mutations require X-CSRF-Token and an exact same-origin Origin or
    Referer. Unknown mutation fields and duplicate JSON keys are rejected. The complete portable configuration, including
    base64 icons, is limited to 16 MiB; mutations exceeding this restore budget return 409 LIMIT_EXCEEDED and roll back.
    Catalogs allow 5000 services, 5000 categories, 5000 tags and 1024 icons. Each icon is at most 1 MiB.
  license:
    name: MIT
    identifier: MIT
servers:
- url: /
tags:
- name: system
  description: Process liveness and database readiness.
- name: setup
  description: Protected first-run initialization.
- name: auth
  description: Single-administrator sessions and password rotation.
- name: public
  description: Visibility-filtered homepage data.
- name: settings
  description: Revision-checked global presentation and access settings.
- name: categories
  description: Category management and exact ordering.
- name: services
  description: Launcher services, links, associations, and ordering.
- name: tags
  description: Searchable service labels.
- name: assets
  description: Validated local icon uploads and access-controlled delivery.
- name: backup
  description: Portable export and validated atomic replacement.
paths:
  /healthz:
    get:
      tags:
      - system
      summary: Liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
        '400': &id001
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id002
          description: Not permitted / CSRF failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id003
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id004
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      operationId: getHealthz
  /readyz:
    get:
      tags:
      - system
      summary: Ready, database initialized
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ready
        '400': *id001
        '403': *id002
        '404': *id003
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      operationId: getReadyz
  /api/v1/setup/status:
    get:
      tags:
      - setup
      summary: Setup status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - initialized
                properties:
                  initialized:
                    type: boolean
        '400': *id001
        '403': *id002
        '404': *id003
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      operationId: getApiV1SetupStatus
  /api/v1/setup:
    post:
      tags:
      - setup
      summary: Create initial admin once; requires locally printed token and valid Origin
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - initialized
                properties:
                  initialized:
                    type: boolean
        '400': *id001
        '403': *id002
        '404': *id003
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              - username
              - password
              properties:
                token:
                  type: string
                  minLength: 20
                username:
                  type: string
                  minLength: 3
                  maxLength: 40
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
      operationId: postApiV1Setup
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login; sets HttpOnly session cookie
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - csrfToken
                properties:
                  csrfToken:
                    type: string
        '400': *id001
        '403': *id002
        '404': *id003
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
      operationId: postApiV1AuthLogin
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Current admin and CSRF token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - username
                - csrfToken
                properties:
                  username:
                    type: string
                  csrfToken:
                    type: string
        '400': *id001
        '401': &id005
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': *id002
        '404': *id003
        '409': &id006
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      operationId: getApiV1AuthMe
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout and revoke session
      responses:
        '204':
          description: OK
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      operationId: postApiV1AuthLogout
  /api/v1/auth/password:
    put:
      tags:
      - auth
      summary: Change password; revoke all sessions
      responses:
        '204':
          description: OK
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 128
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      operationId: putApiV1AuthPassword
  /api/v1/public/bootstrap:
    get:
      tags:
      - public
      summary: Public/authorized homepage data, filtered for visible entries; 401 in private mode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - settings
                - categories
                - services
                - tags
                - health
                properties:
                  settings:
                    $ref: '#/components/schemas/Settings'
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
                  health:
                    type: array
                    items:
                      $ref: '#/components/schemas/HealthStatus'
        '400': *id001
        '403': *id002
        '404': *id003
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      operationId: getApiV1PublicBootstrap
  /api/v1/public/health:
    get:
      tags:
      - public
      summary: Latest check results for visible services; 401 in private mode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthStatus'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      operationId: getApiV1PublicHealth
  /api/v1/admin/settings:
    get:
      tags:
      - settings
      summary: Get full settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      operationId: getApiV1AdminSettings
    put:
      tags:
      - settings
      summary: Replace settings with revision check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400': *id001
        '401': *id005
        '403': *id002
        '404': *id003
        '409': *id006
        '429': *id004
        '500':
          description: Sanitized internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      operationId: putApiV1AdminSettings
  /api/v1/admin/categories:
